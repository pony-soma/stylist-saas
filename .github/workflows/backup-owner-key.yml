name: LiNo Windows recovery key check

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/backup-owner-key.yml
      - scripts/backup/verify-owner-key.ps1
      - tests/backup_owner_key_test.ps1

permissions:
  contents: read

concurrency:
  group: lino-owner-key-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-key-check:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned age in disposable runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'age-v1.3.2.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') {
            throw 'age archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'lino-age')
      - name: Verify helper using disposable identities on Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\tests\backup_owner_key_test.ps1 -AgeExe (Join-Path $env:RUNNER_TEMP 'lino-age\age\age.exe')
      # No environment, owner identity, hosted credentials, or artifacts.
