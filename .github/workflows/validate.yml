name: LiNo validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lino-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-only dummy values. This workflow has no service credentials or deploy step.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_BUILD_ONLY
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_BUILD_ONLY
      NEXT_PUBLIC_BASE_URL: https://example.test
      NEXT_PUBLIC_APP_URL: https://example.test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit and API mock tests
        run: node --experimental-strip-types --test tests/*.test.cjs tests/*.test.mjs
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build with dummy configuration
        run: npm run build
